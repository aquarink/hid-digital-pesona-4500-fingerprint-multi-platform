<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Preview Hasil Scan Fingerprint</title>
  <style>
    body { font-family: sans-serif; background: #1e1e2e; color: #cdd6f4; text-align: center; padding: 40px; }
    .card { background: #313244; max-width: 450px; margin: 0 auto; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    img { background: #11111b; border: 2px solid #89b4fa; border-radius: 8px; margin: 20px 0; max-width: 100%; }
    button { background: #89b4fa; color: #11111b; font-weight: bold; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #b4befe; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Preview Hasil Scan</h2>
    <p>DigitalPersona U.are.U 4500</p>
    <img id="fp" src="fingerprint.png" alt="Belum ada hasil scan (jalankan scan_cli.py terlebih dahulu)">
    <br>
    <button onclick="document.getElementById('fp').src = 'fingerprint.png?t=' + Date.now()">Refresh Gambar</button>
  </div>
</body>
</html>
